name: Update All IPTV Lists

on:
  schedule:
    - cron: '0 */6 * * *'  # Se actualiza solo cada 6 horas
  workflow_dispatch:      # Permite darle al botón de actualizar a mano

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Lists
        run: |
          # Tarea 1: Descargar la lista de siempre (IPFS)
          curl -L "https://ipfs.io/ipns/k2k4r8oqlcjxsritt5mczkcn4mmvcmymbqw7113fz2flkrerfwfps004/data/listas/lista_fuera_iptv.m3u" -o lista.m3u
          
          # Tarea 2: Descargar la lista nueva de ZeroNet (vía Proxy)
          curl -L "https://zeronet.dog/1JKe3VPvFe35bm1aiHdD4p1xcGCkZKhH3Q/content.json" -o lista_zero.m3u

      - name: Commit and Push
        run: |
          git config --global user.name "saviobest11"
          git config --global user.email "bot@github.com"
          git add lista.m3u lista_zero.m3u
          git commit -m "Actualizadas ambas listas: IPFS y ZeroNet" || echo "Sin cambios"
          git push
